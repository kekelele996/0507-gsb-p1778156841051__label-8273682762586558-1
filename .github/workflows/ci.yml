name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run Pint (Code Style Check)
        run: vendor/bin/pint --test

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  backend-test:
    name: Backend Test (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Extract root VERSION
        id: root
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Extract frontend package.json version
        id: frontend
        run: echo "version=$(jq -r '.version' frontend/package.json)" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          ROOT="${{ steps.root.outputs.version }}"
          FRONTEND="${{ steps.frontend.outputs.version }}"

          echo "Root VERSION:     $ROOT"
          echo "Frontend version: $FRONTEND"

          if [ "$ROOT" != "$FRONTEND" ]; then
            echo "::error::Version mismatch! Root VERSION=$ROOT, frontend package.json=$FRONTEND"
            exit 1
          fi

          echo "All versions are consistent: $ROOT"

  build-images:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: |
            animal-app-backend:${{ steps.version.outputs.version }}
            animal-app-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend Version
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(docker run --rm --entrypoint="" animal-app-backend:latest \
            cat /var/www/html/VERSION | tr -d '[:space:]')
          echo "Expected version: $EXPECTED"
          echo "Actual version:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Backend version mismatch! Expected=$EXPECTED, Got=$ACTUAL"
            exit 1
          fi
          echo "Backend version verified: $ACTUAL"

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: |
            animal-app-frontend:${{ steps.version.outputs.version }}
            animal-app-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| animal-app-backend  | \`${{ steps.version.outputs.version }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| animal-app-frontend | \`${{ steps.version.outputs.version }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
